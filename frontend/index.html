    <!-- Pure Vanilla JS Application Script -->
    <script>
      const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? (window.location.port === '8000' ? '' : 'http://localhost:8000')
        : '';

      // API Helper
      async function apiCall(endpoint, options = {}) {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          headers: { 'Content-Type': 'application/json' },
          ...options
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server error: ${res.status}`);
        }
        return res.json();
      }

      // Format Badge Helper
      function getStatusBadge(status) {
        const s = (status || 'UNKNOWN').toUpperCase();
        const styles = {
          RESOLVED: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
          REFUND_INITIATED: 'bg-teal-500/10 text-teal-300 border-teal-500/30',
          UNDER_REVIEW: 'bg-amber-500/10 text-amber-300 border-amber-500/30',
          SUBMITTED: 'bg-indigo-500/10 text-indigo-300 border-indigo-500/30',
          ESCALATED: 'bg-rose-500/10 text-rose-300 border-rose-500/30 font-bold animate-pulse',
          REJECTED: 'bg-slate-700/40 text-slate-400 border-slate-600/30',
          ELIGIBLE: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
          NOT_ELIGIBLE: 'bg-slate-800 text-slate-400 border-slate-700',
          REQUIRES_REVIEW: 'bg-amber-500/10 text-amber-300 border-amber-500/30'
        };
        const icons = {
          RESOLVED: '✓', REFUND_INITIATED: '⚡', UNDER_REVIEW: '⏳', SUBMITTED: '📋',
          ESCALATED: '⚠️', REJECTED: '✕', ELIGIBLE: '✓', NOT_ELIGIBLE: '✕', REQUIRES_REVIEW: '🔍'
        };
        const badgeStyle = styles[s] || 'bg-slate-800 text-slate-300 border-slate-700';
        return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border ${badgeStyle}">
          <span>${icons[s] || '•'}</span>
          <span>${s.replace(/_/g, ' ')}</span>
        </span>`;
      }

      // Render Active Router Navigation Highlight
      function updateNavHighlight(route) {
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.remove('text-emerald-400', 'bg-slate-800/80', 'font-semibold');
          btn.classList.add('text-slate-300');
        });
        const activeBtn = document.getElementById(`nav-${route}`);
        if (activeBtn) {
          activeBtn.classList.remove('text-slate-300');
          activeBtn.classList.add('text-emerald-400', 'bg-slate-800/80', 'font-semibold');
        }
      }

      function applyPreset(num) {
        const cId = document.getElementById('cust-id');
        const tId = document.getElementById('txn-id');
        const cText = document.getElementById('complaint-text');
        const resultContainer = document.getElementById('result-container');
        if (resultContainer) resultContainer.innerHTML = '';

        if (num === 1) {
          if (cId) cId.value = 'C001';
          if (tId) tId.value = 'TXN1001';
          if (cText) cText.value = 'My money was deducted but my order failed.';
        } else if (num === 2) {
          if (cId) cId.value = 'C002';
          if (tId) tId.value = 'TXN1002';
          if (cText) cText.value = "My order was cancelled but I haven't received my refund.";
        } else if (num === 3) {
          if (cId) cId.value = 'C008';
          if (tId) tId.value = 'TXN1009';
          if (cText) cText.value = "I don't recognize this transaction of ₹9999 on my account.";
        }
      }

      async function submitDisputeForm() {
        const custId = document.getElementById('cust-id').value.trim();
        const txnId = document.getElementById('txn-id').value.trim();
        const complaint = document.getElementById('complaint-text').value.trim();
        const errorDiv = document.getElementById('form-error');
        const btn = document.getElementById('submit-btn');
        const resultContainer = document.getElementById('result-container');

        if (!custId || !txnId || !complaint) {
          errorDiv.innerText = '⚠️ Please fill in all required fields.';
          errorDiv.classList.remove('hidden');
          return;
        }

        errorDiv.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = `<span class="animate-spin">⏳</span> <span>AI is analyzing your dispute...</span>`;

        try {
          const res = await apiCall('/api/disputes', {
            method: 'POST',
            body: JSON.stringify({ customer_id: custId, transaction_id: txnId, complaint_text: complaint })
          });

          // Render Result Card
          const d = res.dispute;
          const t = res.transaction_details;

          resultContainer.innerHTML = `
            <div class="glass-card p-6 sm:p-8 rounded-3xl border border-emerald-500/30 space-y-6 shadow-2xl animate-fade-in mt-6">
              
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-slate-800">
                <div>
                  <span class="text-xs font-bold uppercase tracking-wider text-emerald-400 block mb-1">Analysis Complete</span>
                  <h2 class="text-2xl font-extrabold text-white">Ticket #${d.ticket_id}</h2>
                </div>
                ${getStatusBadge(d.status)}
              </div>

              <!-- Issue & Category -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-1">
                  <span class="text-[11px] font-semibold text-slate-400 uppercase block">Complaint Text</span>
                  <p class="text-xs text-slate-200">"${d.complaint_text}"</p>
                </div>
                <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-1">
                  <span class="text-[11px] font-semibold text-emerald-400 uppercase block">Issue Detected</span>
                  <p class="text-sm font-bold text-white">${d.issue_detected}</p>
                </div>
              </div>

              <!-- Database Verification -->
              <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-800 space-y-3">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-300 block">🔍 Database & Gateway Audit</span>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                  <div><span class="text-slate-400 block">Txn ID</span><span class="font-mono text-white font-bold">${t.id}</span></div>
                  <div><span class="text-slate-400 block">Amount</span><span class="font-bold text-emerald-400">₹${t.amount}</span></div>
                  <div><span class="text-slate-400 block">Gateway Status</span><span class="font-semibold ${t.status === 'SUCCESS' ? 'text-emerald-400' : 'text-rose-400'}">${t.status}</span></div>
                  <div><span class="text-slate-400 block">Order Status</span><span class="font-semibold ${t.order_status === 'FAILED' ? 'text-rose-400' : 'text-slate-200'}">${t.order_status}</span></div>
                </div>
              </div>

              <!-- Recommendation & RAG Policy -->
              <div class="bg-emerald-500/10 p-5 rounded-2xl border border-emerald-500/20 space-y-1">
                <span class="text-xs font-bold text-emerald-400 uppercase block">AI Recommendation</span>
                <p class="text-sm font-semibold text-white">${d.ai_recommendation}</p>
              </div>

              ${d.relevant_policy ? `
                <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 space-y-1 text-xs">
                  <span class="text-slate-400 font-semibold block">📚 Retrieved RAG Policy Clause</span>
                  <p class="text-slate-300 italic whitespace-pre-line bg-slate-950 p-3 rounded-xl border border-slate-850">${d.relevant_policy}</p>
                </div>
              ` : ''}

              <!-- Actions -->
              <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
                <span class="text-xs text-slate-400 font-mono">Status: <strong class="text-white">${d.resolution_action}</strong></span>
                <a href="#/track?ticket=${d.ticket_id}" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-xs shadow-md hover:opacity-95">
                  Track Ticket Progress →
                </a>
              </div>

            </div>
          `;
        } catch (err) {
          errorDiv.innerText = `⚠️ ${err.message}`;
          errorDiv.classList.remove('hidden');
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<span>Analyze My Dispute</span> <span>→</span>`;
        }
      }

      // 3. TRACK DISPUTE PAGE
      async function renderTrack() {
        updateNavHighlight('track');
        const container = document.getElementById('app-view');
        
        // Extract ticket param from URL hash e.g. #/track?ticket=DSP-10001
        const hash = window.location.hash;
        let searchTicket = 'DSP-10001';
        if (hash.includes('ticket=')) {
          searchTicket = hash.split('ticket=')[1].split('&')[0];
        }

        container.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-6 py-4">
            
            <div class="text-center max-w-xl mx-auto space-y-2">
              <h1 class="text-3xl font-extrabold text-white tracking-tight">Track Dispute Ticket</h1>
              <p class="text-xs text-slate-400">Enter your Ticket ID to view resolution status and timeline.</p>
            </div>

            <!-- Search Bar -->
            <div class="glass-card p-4 rounded-2xl border border-slate-800 space-y-3">
              <div class="flex gap-3">
                <input type="text" id="track-id-input" value="${searchTicket}" placeholder="e.g. DSP-10001" class="flex-1 px-4 py-3 glass-input rounded-xl text-white font-mono text-sm" />
                <button onclick="fetchAndRenderTicket()" class="px-6 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-sm rounded-xl hover:opacity-95">
                  Track Ticket
                </button>
              </div>

              <div class="flex items-center gap-2 text-xs text-slate-400 pt-2 border-t border-slate-800/80">
                <span class="font-semibold text-slate-300">Quick Test Tickets:</span>
                <button onclick="quickTrack('DSP-10001')" class="px-2.5 py-1 rounded bg-slate-800 text-emerald-400 font-mono text-[11px]">DSP-10001</button>
                <button onclick="quickTrack('DSP-10002')" class="px-2.5 py-1 rounded bg-slate-800 text-emerald-400 font-mono text-[11px]">DSP-10002</button>
                <button onclick="quickTrack('DSP-10003')" class="px-2.5 py-1 rounded bg-slate-800 text-rose-300 font-mono text-[11px]">DSP-10003 (Fraud)</button>
              </div>
            </div>

            <div id="track-result"></div>

          </div>
        `;

        if (searchTicket) {
          fetchAndRenderTicket();
        }
      }

      function quickTrack(id) {
        document.getElementById('track-id-input').value = id;
        fetchAndRenderTicket();
      }

      async function fetchAndRenderTicket() {
        const input = document.getElementById('track-id-input').value.trim();
        const resultDiv = document.getElementById('track-result');
        if (!input) return;

        resultDiv.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs">Searching ticket database...</div>`;

        try {
          const data = await apiCall(`/api/tickets/${encodeURIComponent(input)}`);

          const timelineHtml = data.timeline.map((st, idx) => `
            <div class="flex-1 p-3 rounded-xl border text-center text-xs ${st.completed ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-500'}">
              <div class="font-bold text-sm mb-0.5">${st.completed ? '✓' : idx + 1}</div>
              <div class="font-medium text-[11px]">${st.step}</div>
            </div>
          `).join('');

          resultDiv.innerHTML = `
            <div class="glass-card p-6 sm:p-8 rounded-3xl border border-slate-800 space-y-6 shadow-2xl animate-fade-in">
              
              <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <div>
                  <span class="text-xs font-mono font-bold text-emerald-400 block mb-1">TICKET ID: ${data.ticket_id}</span>
                  <h2 class="text-xl font-bold text-white">${data.issue_detected}</h2>
                </div>
                ${getStatusBadge(data.status)}
              </div>

              <!-- Timeline -->
              <div class="space-y-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Resolution Timeline</span>
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                  ${timelineHtml}
                </div>
              </div>

              <!-- Details Grid -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-1">
                  <span class="text-slate-400 uppercase text-[10px] block font-semibold">Complaint</span>
                  <p class="text-slate-200 font-medium">"${data.complaint}"</p>
                </div>

                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-1">
                  <span class="text-emerald-400 uppercase text-[10px] block font-semibold">AI Recommendation</span>
                  <p class="text-white font-bold">${data.ai_recommendation}</p>
                </div>
              </div>

              ${data.relevant_policy ? `
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 space-y-1 text-xs">
                  <span class="text-slate-400 font-semibold block">📚 Verified Policy</span>
                  <p class="text-slate-300 italic whitespace-pre-line">${data.relevant_policy}</p>
                </div>
              ` : ''}

            </div>
          `;
        } catch (err) {
          resultDiv.innerHTML = `<div class="p-4 bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs rounded-xl text-center">⚠️ ${err.message}</div>`;
        }
      }

      // 4. ADMIN DASHBOARD PAGE
      async function renderDashboard() {
        updateNavHighlight('dashboard');
        const container = document.getElementById('app-view');
        
        container.innerHTML = `
          <div class="space-y-6 py-4">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Admin Resolution Dashboard</h1>
                <p class="text-xs text-slate-400">Monitor live disputes, audit decision matrix, and override resolution states.</p>
              </div>

              <div class="flex gap-2">
                <button onclick="renderDashboard()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-semibold text-slate-200 hover:bg-slate-700">🔄 Refresh</button>
                <button onclick="reseedDemoData()" class="px-4 py-2 rounded-xl bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 text-xs font-semibold hover:bg-indigo-500/20">🌱 Reset Data</button>
              </div>
            </div>

            <!-- Stats Bar -->
            <div id="stats-cards" class="grid grid-cols-2 md:grid-cols-5 gap-4">
              <div class="glass-card p-4 rounded-2xl border border-slate-800 text-center"><span class="text-xs text-slate-400">Loading Stats...</span></div>
            </div>

            <!-- Disputes Table Container -->
            <div class="glass-card rounded-3xl border border-slate-800 overflow-hidden shadow-2xl">
              
              <div class="p-4 border-b border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <h3 class="text-xs font-bold text-white uppercase tracking-wider">Disputes Management Table</h3>
                
                <div class="flex flex-wrap items-center gap-2 text-xs">
                  <span class="text-slate-400 font-semibold">Status:</span>
                  <button onclick="filterDashboard('ALL')" class="dash-filter-btn px-3 py-1 rounded-lg bg-emerald-500 text-slate-950 font-bold" id="st-ALL">ALL</button>
                  <button onclick="filterDashboard('PENDING')" class="dash-filter-btn px-3 py-1 rounded-lg text-slate-400 hover:text-white" id="st-PENDING">PENDING</button>
                  <button onclick="filterDashboard('ESCALATED')" class="dash-filter-btn px-3 py-1 rounded-lg text-slate-400 hover:text-white" id="st-ESCALATED">ESCALATED</button>
                  <button onclick="filterDashboard('RESOLVED')" class="dash-filter-btn px-3 py-1 rounded-lg text-slate-400 hover:text-white" id="st-RESOLVED">RESOLVED</button>
                </div>
              </div>

              <div id="table-container" class="overflow-x-auto">
                <div class="p-8 text-center text-slate-400 text-xs">Loading dispute records...</div>
              </div>

            </div>

          </div>
        `;

        loadDashboardData('ALL');
      }

      let currentFilter = 'ALL';

      function filterDashboard(st) {
        currentFilter = st;
        document.querySelectorAll('.dash-filter-btn').forEach(btn => {
          btn.classList.remove('bg-emerald-500', 'text-slate-950', 'font-bold');
          btn.classList.add('text-slate-400');
        });
        const active = document.getElementById(`st-${st}`);
        if (active) {
          active.classList.remove('text-slate-400');
          active.classList.add('bg-emerald-500', 'text-slate-950', 'font-bold');
        }
        loadDashboardData(st);
      }

      async function reseedDemoData() {
        if (confirm('Re-seed database with fresh demo records?')) {
          await apiCall('/api/seed', { method: 'POST' });
          renderDashboard();
        }
      }

      async function loadDashboardData(statusFilter = 'ALL') {
        try {
          const stats = await apiCall('/api/stats');
          const disputes = await apiCall(`/api/disputes${statusFilter !== 'ALL' ? '?status=' + statusFilter : ''}`);

          // Render Stats Cards
          document.getElementById('stats-cards').innerHTML = `
            <div class="glass-card p-4 rounded-2xl border border-slate-800 space-y-1"><span class="text-xs text-slate-400">Total Disputes</span><div class="text-2xl font-bold text-white">${stats.total_disputes}</div></div>
            <div class="glass-card p-4 rounded-2xl border border-emerald-500/20 space-y-1"><span class="text-xs text-emerald-400">Resolved</span><div class="text-2xl font-bold text-emerald-400">${stats.resolved_disputes}</div></div>
            <div class="glass-card p-4 rounded-2xl border border-amber-500/20 space-y-1"><span class="text-xs text-amber-400 font-semibold">Pending Review</span><div class="text-2xl font-bold text-amber-300">${stats.pending_disputes}</div></div>
            <div class="glass-card p-4 rounded-2xl border border-rose-500/20 space-y-1"><span class="text-xs text-rose-400 font-semibold">Escalated (Fraud)</span><div class="text-2xl font-bold text-rose-400">${stats.escalated_disputes}</div></div>
            <div class="glass-card p-4 rounded-2xl border border-teal-500/20 space-y-1 col-span-2 sm:col-span-1"><span class="text-xs text-teal-400 font-semibold">Total Refunded</span><div class="text-2xl font-bold text-teal-300">₹${stats.total_refunded_amount}</div></div>
          `;

          // Render Table
          const tableContainer = document.getElementById('table-container');
          if (disputes.length === 0) {
            tableContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs">No dispute records matching filter '${statusFilter}'.</div>`;
            return;
          }

          const rows = disputes.map(d => `
            <tr class="hover:bg-slate-900/60 transition-colors">
              <td class="p-4 font-mono font-bold text-emerald-400">${d.ticket_id}</td>
              <td class="p-4 font-medium text-white">${d.customer_id}</td>
              <td class="p-4 font-mono text-slate-400">${d.transaction_id || 'N/A'}</td>
              <td class="p-4 font-medium text-slate-200 max-w-xs truncate">${d.issue_detected}</td>
              <td class="p-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${d.priority === 'CRITICAL' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-slate-800 text-slate-300'}">${d.priority}</span></td>
              <td class="p-4 font-semibold text-slate-200">${d.confidence}%</td>
              <td class="p-4">${getStatusBadge(d.status)}</td>
              <td class="p-4 text-right">
                <a href="#/track?ticket=${d.ticket_id}" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-[11px] font-semibold hover:bg-slate-700">Inspect</a>
              </td>
            </tr>
          `).join('');

          tableContainer.innerHTML = `
            <table class="w-full text-left text-xs text-slate-300">
              <thead class="bg-slate-900 text-slate-400 uppercase text-[10px] tracking-wider font-semibold border-b border-slate-800">
                <tr>
                  <th class="p-4">Ticket ID</th>
                  <th class="p-4">Customer</th>
                  <th class="p-4">Txn ID</th>
                  <th class="p-4">Issue Detected</th>
                  <th class="p-4">Priority</th>
                  <th class="p-4">Confidence</th>
                  <th class="p-4">Status</th>
                  <th class="p-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60">${rows}</tbody>
            </table>
          `;

        } catch (err) {
          document.getElementById('table-container').innerHTML = `<div class="p-6 bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs rounded-xl text-center">⚠️ ${err.message}</div>`;
        }
      }

      // --- CLIENT ROUTER SWITCH ---
      function handleRouting() {
        const hash = window.location.hash || '#/';
        if (hash.startsWith('#/dispute')) {
          renderDisputeForm();
        } else if (hash.startsWith('#/track')) {
          renderTrack();
        } else if (hash.startsWith('#/dashboard')) {
          renderDashboard();
        } else {
          renderLanding();
        }
      }

      window.addEventListener('hashchange', handleRouting);
      window.addEventListener('load', handleRouting);
    </script>
  </body>
</html>
